<div class="perf-page">
  <div class="page-header-icon perf-icon">⚡</div>
  <h1 class="page-title">Largest Contentful Paint</h1>
  <p class="page-subtitle">
    LCP measures the render time of the largest visible image or text block — target
    <code>&lt; 2.5 s</code>. Fix it by preloading the hero image, serving modern formats,
    and reducing TTFB.
  </p>

  <app-page-meta [readingTime]="22" difficulty="intermediate" since="2020" tech="javascript" />

  <app-quick-ref [items]="quickRef" />

  <app-theory-block [sections]="theory" />

  <section class="perf-section">
    <h2>Code Examples</h2>
    <app-code-block [tabs]="codeTabs" />
  </section>

  <app-common-mistakes [items]="mistakes" />

  <app-challenge-block [item]="challenge" />

  <app-quiz-block [items]="quiz" />

  <app-qna-block [items]="qna" />

  <app-revision-card [summary]="revision" />

  <app-page-complete
    route="perf-lcp"
    nextRoute="/performance/inp"
    nextLabel="Interaction to Next Paint" />
</div>
