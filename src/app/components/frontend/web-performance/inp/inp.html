<div class="perf-page">
  <div class="page-header-icon perf-icon">⚡</div>
  <h1 class="page-title">Interaction to Next Paint</h1>
  <p class="page-subtitle">
    INP measures the worst interaction delay across the entire page visit — target
    <code>&lt; 200 ms</code>. Break long tasks with <code>scheduler.yield()</code>,
    avoid layout thrashing, and defer heavy third-party scripts.
  </p>

  <app-page-meta [readingTime]="20" difficulty="intermediate" since="2024" tech="javascript" />

  <app-quick-ref [items]="quickRef" />

  <app-theory-block [sections]="theory" />

  <section class="perf-section">
    <h2>Code Examples</h2>
    <app-code-block [tabs]="codeTabs" />
  </section>

  <app-common-mistakes [items]="mistakes" />

  <app-challenge-block [item]="challenge" />

  <app-quiz-block [items]="quiz" />

  <app-qna-block [items]="qna" />

  <app-revision-card [summary]="revision" />

  <app-page-complete
    route="perf-inp"
    nextRoute="/performance/cls"
    nextLabel="Cumulative Layout Shift" />
</div>
