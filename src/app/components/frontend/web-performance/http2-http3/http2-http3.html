  <h1 class="page-title">HTTP/2 &amp; HTTP/3</h1>
  <p class="page-subtitle">
    HTTP/2 multiplexes requests on one TCP connection — eliminating domain sharding.
    HTTP/3 (QUIC) goes further: packet loss no longer blocks all streams, and
    <code>0-RTT</code> resumes sessions in the first packet.
  </p>
