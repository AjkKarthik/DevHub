<div class="perf-page">
  <div class="page-header-icon perf-icon">⚡</div>
  <h1 class="page-title">Cumulative Layout Shift</h1>
  <p class="page-subtitle">
    CLS measures unexpected visual instability — target <code>&lt; 0.1</code>.
    Reserve space for images and ads, avoid injecting content above existing elements,
    and use <code>aspect-ratio</code> for responsive media.
  </p>

  <app-page-meta [readingTime]="18" difficulty="intermediate" since="2020" tech="javascript" />

  <app-quick-ref [items]="quickRef" />

  <app-theory-block [sections]="theory" />

  <section class="perf-section">
    <h2>Code Examples</h2>
    <app-code-block [tabs]="codeTabs" />
  </section>

  <app-common-mistakes [items]="mistakes" />

  <app-challenge-block [item]="challenge" />

  <app-quiz-block [items]="quiz" />

  <app-qna-block [items]="qna" />

  <app-revision-card [summary]="revision" />

  <app-page-complete
    route="perf-cls"
    nextRoute="/performance/critical-rendering-path"
    nextLabel="Critical Rendering Path" />
</div>
