<div class="ng-page">
  <div class="page-header-icon ng-icon">A</div>
  <h1 class="page-title">AG Grid with Angular</h1>
  <p class="page-subtitle">Industry-standard Angular data grid — rowData signals, ColDef column definitions, cell renderers, quick filters, CSV export, and the GridApi all wired to Angular's reactive system.</p>

  <app-page-meta [readingTime]="28" difficulty="intermediate" since="AG Grid 31" tech="angular" />

  <app-prerequisites [items]="prerequisites" />

  <app-quick-ref [items]="quickRef" />

  <app-theory-block [sections]="theory" />

  <section class="ng-section">
    <h2>Code Examples</h2>
    <app-code-block [tabs]="codeTabs" />
  </section>

  <section class="ng-section">
    <h2>Employee Grid</h2>
    <div class="demo-card">
      <div class="toolbar">
        <input
          type="text"
          placeholder="Quick filter all columns..."
          class="filter-input"
          (input)="applyFilter($any($event.target).value)"
        />
        <button type="button" class="btn" (click)="exportCsv()">Export CSV</button>
        @if (selectedCount() > 0) {
          <span class="selection-badge">{{ selectedCount() }} selected</span>
        }
      </div>
      <ag-grid-angular
        [theme]="theme"
        [rowData]="rowData()"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        rowSelection="multiple"
        (gridReady)="onGridReady($event)"
        (selectionChanged)="onSelectionChanged()"
        class="grid"
      />
    </div>
  </section>

  <app-before-after [items]="beforeAfter" beforeLabel="Old Pattern" afterLabel="Modern Angular" />

  <app-common-mistakes [items]="mistakes" />

  <app-challenge-block [item]="challenge" />

  <app-quiz-block [items]="quiz" />

  <app-qna-block [items]="qna" />

  <app-revision-card [summary]="revision" />

  <app-page-complete route="ag-grid" nextRoute="/angular/ng-image" nextLabel="Image Optimization" />
</div>
