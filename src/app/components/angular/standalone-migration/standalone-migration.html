<div class="ng-page">
  <div class="page-header-icon ng-icon">A</div>
  <h1 class="page-title">Standalone Migration</h1>
  <p class="page-subtitle">
    Migrate NgModule-based Angular apps to standalone components using the official
    3-pass schematic — and understand every change it makes so you can verify and fix edge cases.
  </p>

  <app-page-meta [readingTime]="20" difficulty="intermediate" since="Angular 14 / CLI 15" tech="angular" />

  <app-quick-ref [items]="quickRef" />

  <app-theory-block [sections]="theory" />

  <section class="ng-section">
    <h2>Code Examples</h2>
    <app-code-block [tabs]="codeTabs" />
  </section>

  <app-before-after [items]="beforeAfter"
    beforeLabel="NgModule"
    afterLabel="Standalone" />

  <app-common-mistakes [items]="mistakes" />

  <app-challenge-block [item]="challenge" />

  <app-quiz-block [items]="quiz" />

  <app-qna-block [items]="qna" />

  <app-revision-card [summary]="revision" />

  <app-page-complete
    route="standalone-migration"
    nextRoute="/angular/error-handling-patterns"
    nextLabel="Error Handling Patterns" />
</div>
