<div class="page">
  <h1>Chart.js Visualizations</h1>
  <p class="subtitle">Interactive data visualizations using Chart.js — bar, line, and doughnut charts with live data updates.</p>

  <app-page-meta [readingTime]="10" difficulty="intermediate" since="16" />
  <app-quick-ref [items]="quickRef" />

  <app-theory-block [sections]="theory" />
  <app-code-block [tabs]="tabs" />

  <!-- Bar chart -->
  <section class="demo-section">
    <h2>Bar Chart — Monthly Sales</h2>
    <div class="demo-card">
      <div class="controls">
        <button (click)="randomizeBar()">Randomize Data</button>
      </div>
      <div class="chart-container">
        <canvas #barCanvas></canvas>
      </div>
    </div>
  </section>

  <!-- Line chart -->
  <section class="demo-section">
    <h2>Line Chart — Revenue vs Expenses</h2>
    <div class="demo-card">
      <div class="controls">
        <button (click)="randomizeLine()">Randomize Data</button>
      </div>
      <div class="chart-container">
        <canvas #lineCanvas></canvas>
      </div>
    </div>
  </section>

  <!-- Doughnut chart -->
  <section class="demo-section">
    <h2>Doughnut Chart — Codebase Breakdown</h2>
    <div class="demo-card">
      <div class="chart-container chart-sm">
        <canvas #pieCanvas></canvas>
      </div>
    </div>
  </section>

  <app-before-after [items]="beforeAfter" />
  <app-common-mistakes [items]="mistakes" />
  <app-version-badge [items]="versionItems" />
  <app-challenge-block [item]="challenge" />
  <app-quiz-block [items]="quiz" />
  <app-qna-block [items]="qna" />
  <app-page-complete route="/charts" nextRoute="/ag-grid" nextLabel="Ag Grid" />
</div>
