<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DevHub</title>
  <script>
    // GitHub Pages SPA redirect — encodes the current Angular route into the
    // query string so that index.html can restore it before Angular bootstraps.
    // segmentCount = 1 because the app is served at /DevHub/ (one path segment).
    var segmentCount = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
